version: "3.8"

services:
  go-api:
    container_name: go-image-processor
    build:
      context: .
    ports:
      - "8849" # So you can still use Postman from your host
    networks:
      - traefik-proxy
    volumes:
      - go_modules:/go/pkg/mod
    labels:
      - "traefik.enable=true"
      # Replace 'yourdomain.com' with your actual domain
      - "traefik.http.routers.go_image.entrypoints=web"
      # Tell Traefik which port the Node app is listening on inside the container
      - "traefik.http.services.go_image.loadbalancer.server.port=8849"
      - "traefik.docker.network=traefik-proxy"

networks:
  traefik-proxy:
    external: true
volumes:
  go_modules:
    external: true
